name: Update G CSV database

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Zagreb"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-g-podaci
  cancel-in-progress: false

env:
  INPUT_XLSX: "G tablice.xlsx"
  GENERATOR_SCRIPT: "izradi_G_bazu.py"
  OUTPUT_CSV: "G_podaci.csv"

jobs:
  update-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install "openpyxl>=3.1,<4"

      - name: Check required files
        shell: bash
        run: |
          test -f "$INPUT_XLSX" || { echo "Missing input file: $INPUT_XLSX"; exit 1; }
          test -f "$GENERATOR_SCRIPT" || { echo "Missing generator: $GENERATOR_SCRIPT"; exit 1; }

      - name: Generate CSV database
        run: python "$GENERATOR_SCRIPT" "$INPUT_XLSX" "$OUTPUT_CSV"

      - name: Commit updated CSV if it changed
        shell: bash
        run: |
          git add -- "$OUTPUT_CSV"

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update G CSV database"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
